[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urducap"
version = "2.0.0"
description = "Image captioning in Urdu: a 2024 CNN-GRU baseline re-evaluated against SigLIP 2 + mBART-50 and a LoRA-tuned vision-language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shelender Kumar" }]
dependencies = [
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==5.24.0",
    "peft==0.22.0",
    "sentencepiece==0.2.3",
    "sacrebleu==2.6.0",
    "pycocoevalcap==1.2",
    "pandas==3.1.1",
    "openpyxl==3.1.5",
    "pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "scikit-learn==1.9.1", "nltk==3.10.4"]

[project.scripts]
urducap = "urducap.cli:main"

[tool.setuptools.packages.find]
include = ["urducap*"]

[tool.ruff]
line-length = 110
extend-exclude = ["legacy", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
